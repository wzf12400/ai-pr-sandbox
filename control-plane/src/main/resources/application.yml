spring:
  application:
    name: github-ai-agent-control-plane
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/github_ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      url: ${REDIS_URL:redis://127.0.0.1:6379/0}
      repositories:
        enabled: false

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

app:
  policy-id: ${AUTOMATION_POLICY_ID:local-development-policy}
  worker:
    redis-enabled: ${WORKER_REDIS_ENABLED:true}
    queue-key: ${WORKER_QUEUE_KEY:github-ai-agent:jobs:v2}
    outbox-batch-size: ${WORKER_OUTBOX_BATCH_SIZE:100}
    outbox-publish-delay: ${WORKER_OUTBOX_PUBLISH_DELAY:2s}
    reconciliation-enabled: ${WORKER_RECONCILIATION_ENABLED:false}
    reconciliation-batch-size: ${WORKER_RECONCILIATION_BATCH_SIZE:100}
    reconciliation-delay: ${WORKER_RECONCILIATION_DELAY:5m}
    reconciliation-republish-after: ${WORKER_RECONCILIATION_REPUBLISH_AFTER:10m}
    stale-task-timeout: ${WORKER_STALE_TASK_TIMEOUT:30m}
    max-task-retries: ${WORKER_MAX_RETRIES:3}
  chat:
    enabled: ${AI_CHAT_ENABLED:true}
    base-url: ${AI_BASE_URL:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:ailemac/gpt-5-mini}
    safety-identifier: ${AI_SAFETY_IDENTIFIER:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:30}
    max-completion-tokens: ${AI_MAX_COMPLETION_TOKENS:800}
    api-mode: ${AI_API_MODE:strict}
    async-reply: ${AI_ASYNC_REPLY:true}
  repository-catalog:
    - repository: wzf12400/ai-pr-sandbox
      keywords: ["测试仓库", "计算器", "加法", "减法", "乘法", "除法", "calculator", "divide", "sandbox"]
