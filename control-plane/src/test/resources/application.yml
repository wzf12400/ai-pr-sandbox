spring:
  datasource:
    url: jdbc:h2:mem:control_plane;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      repositories:
        enabled: false

app:
  policy-id: test-policy
  worker:
    redis-enabled: false
    queue-key: github-ai-agent:test-jobs:v2
    outbox-batch-size: 100
    outbox-publish-delay: 1h
    reconciliation-enabled: false
    reconciliation-batch-size: 100
    reconciliation-delay: 1h
    reconciliation-republish-after: 10m
    stale-task-timeout: 30m
    max-task-retries: 3
  repository-catalog:
    - repository: demo-company/payment-service
      keywords: ["支付", "订单", "payment", "order"]
    - repository: demo-company/customer-portal
      keywords: ["用户", "登录", "user", "login"]
